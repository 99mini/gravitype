name: CI

# 검증과 배포를 한 워크플로에 둔다 — deploy 가 quality/build 를 `needs` 로
# 기다리므로 검사가 깨진 채 배포가 나가는 일이 없다.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # 코드 변경 없이 다시 배포하고 싶을 때

concurrency:
  group: ci-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 검사를 버린다. main 은 배포가 도중에 끊기면 안 되므로 두지 않는다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: 타입·린트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json 의 packageManager 를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: 산출물 크기
        run: |
          {
            echo "### 빌드 산출물"
            echo '```'
            du -sh dist
            find dist -type f -exec ls -lh {} + | awk '{print $5, $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 배포 잡이 다시 빌드하지 않도록 넘겨준다(검사한 그 산출물이 그대로 나간다).
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: GitHub Pages 배포
    if: github.event_name != 'pull_request'
    needs: [quality, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 저장소에 Pages 가 아직 꺼져 있어도 켠다
      - uses: actions/deploy-pages@v4
        id: deployment
